version: '3.8'

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: "5000"
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/prisma:/app/prisma

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
