databases:
  - name: edupro-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: edupro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edupro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: STORAGE_PROVIDER
        value: local
      - key: SEED_DEMO_ACCOUNTS
        value: "true"
      - key: SEED_ADMIN_PASSWORD
        value: admin1234
      - key: SEED_TEACHER_PASSWORD
        value: teacher1234
      - key: SEED_STUDENT_PASSWORD
        value: student1234
